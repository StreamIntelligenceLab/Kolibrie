[workspace]
resolver = "2"
# `python` is excluded from default-members because it is a cdylib and needs a
# dedicated build; it has its own CI job. Everything else must be checked by a
# bare `cargo build`/`clippy`.
default-members = [
  "kolibrie",
  "shared",
  "datalog",
  "datalogmtl",
  "ml",
  "cli",
  "kolibrie-http-server",
]
members = [
  "kolibrie",
  "shared",
  "datalog",
  "datalogmtl",
  "python",
  "ml",
  "cli",
  "kolibrie-http-server",
]

exclude = [
  "target/", # exclude bench testing
]

[workspace.package]
version      = "0.1.1"
edition      = "2021"
license      = "MPL-2.0"
# Floor imposed by the dependency tree (hashbrown / indexmap / toml_edit all
# declare 1.85). Enforced by a dedicated CI job, not merely declared.
rust-version = "1.85"
authors      = [
  "Volodymyr Kadzhaia <vkadzhaia@gmail.com>",
  "Pieter Bonte <pieter.bonte@kuleuven.be>",
]
repository   = "https://github.com/StreamIntelligenceLab/Kolibrie"

# Everything starts at `warn`. Escalation to `deny` happens per crate, once that
# crate's count reaches zero — see the architecture doc, §8.
[workspace.lints.rust]
# The workhorse for the surface-shrinking work: flags every `pub` item that is
# not reachable from the crate root, i.e. exactly the set that should be
# `pub(crate)`.
unreachable_pub               = "warn"
missing_docs                  = "warn"
missing_debug_implementations = "warn"
unused_qualifications         = "warn"
unused_lifetimes              = "warn"
unsafe_code                   = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Deliberately off: too noisy to be useful before the surface shrinks.
must_use_candidate      = "allow"
module_name_repetitions = "allow"

[workspace.dependencies]
quick-xml = "0.38.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
rand = "0.9.2"
rayon = "1.10.0"
nom = "8.0.0"
url = "2.5.2"
percent-encoding = "2.3.1"
httparse = "1.9.4"
crossbeam = "0.8.4"
# Features are declared per-consumer: `extension-module` is correct only for the
# cdylib and actively breaks crates that EMBED Python (it suppresses libpython
# linking). See python/ and ml/.
pyo3 = { version = "0.25.1" }
clap = { version = "4.5.45", features = ["derive"] }

[profile.bench]
debug = true

[profile.dev]
opt-level = 2
debug = true
debug-assertions = true
overflow-checks = true
lto = "thin"
panic = 'unwind'
incremental = false
codegen-units = 256

[profile.release]
opt-level = 3
debug = true
strip = "none"
debug-assertions = false
overflow-checks = false
lto = "thin"
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
