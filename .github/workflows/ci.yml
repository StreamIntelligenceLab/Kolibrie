name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Gates that must stay green ──────────────────────────────────────────────

  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [default, no-default]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          if [ "${{ matrix.features }}" = "no-default" ]; then
            cargo build --workspace --all-targets --no-default-features
          else
            cargo build --workspace --all-targets
          fi
      # `--all-targets` is deliberately present in the build above and absent here.
      # In a test run it pulls in the 13 `harness = false` bench targets, which
      # criterion then runs in test mode, and `citybench_cross_window_compare` does
      # not survive that: SIGKILLed in a 7.7GB container, and 12.3GB resident after
      # ten minutes on a 48GB host while still growing, against the 16GB of an
      # `ubuntu-latest` runner. The build step already compile-checks every target,
      # so dropping it here loses no coverage -- and gains doc tests, which
      # `--all-targets` excludes.
      - name: Test
        run: |
          if [ "${{ matrix.features }}" = "no-default" ]; then
            cargo test --workspace --no-default-features
          else
            cargo test --workspace
          fi

      # Runs the examples rather than only compiling them. This workflow compiled
      # them for months while three were broken anyway: a rule syntax the parser
      # rejects, an absolute path into a personal directory, and a gitignored
      # dataset. None of those is visible to `cargo build`.
      #
      # Default features only: the script skips every example carrying
      # `required-features`, and the no-default leg has not built them.
      #
      # Costs about 18s here, reusing the build above. The same run takes 185s on
      # macOS, where a per-binary Gatekeeper assessment dominates and is charged
      # again after every relink; Linux has no equivalent, and a second run costs
      # the same as the first.
      - name: Run the examples
        if: matrix.features == 'default'
        run: python3 scripts/smoke_examples.py "${{ runner.temp }}/smoke"

      # The script keeps each failing example's output in a file and prints only the
      # name and the path. That path dies with the runner, so without this a failure
      # here is unreproducible -- the same mistake `scripts/verify.sh` was written to
      # stop: never summarise output without retaining it.
      - name: Show the failing examples' output
        if: failure() && matrix.features == 'default'
        run: |
          shopt -s nullglob
          for f in "${{ runner.temp }}"/smoke/examples/*.log; do
            echo "::group::$(basename "$f")"
            cat "$f"
            echo "::endgroup::"
          done

  # Blocking since the workspace was formatted. The one-off `cargo fmt --all` that
  # this was waiting on landed as 182 files and ~1,578 hunks, so the tree now matches
  # rustfmt exactly and any drift is a real finding rather than the backlog.
  #
  # `rustfmt.toml` is deliberately minimal — defaults plus `max_width = 100` — so
  # what this enforces stays predictable.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin to the declared rust-version so the MSRV is enforced, not aspirational.
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Broken intra-doc links are a hard failure even while `missing_docs` is
      # still only a warning.
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"

  # ── The ML / Python surface, which `default-members` does not cover ─────────

  ml:
    name: ml feature + python cdylib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p kolibrie --features ml --all-targets
      # Builds the cdylib and then actually imports it: building alone never
      # executed a line of Python, which is the gap `smoke_examples.py` closes on
      # the Rust side. It runs every example in `python/examples`.
      - run: python3 scripts/smoke_python.py

  # Blocking because these lints have reached zero in the scopes listed below and
  # must stay there. Both stay at `warn` in [workspace.lints] on purpose: making a
  # module private, or adding a public item mid-change, is exactly what trips them,
  # and a local `deny` would stop the build halfway through an edit. The gate belongs
  # at PR time instead.
  #
  # Checked under three feature configurations, not one. The default build cannot see
  # items behind `#[cfg(feature = "ml")]`: eight unreachable-pub items were missed on
  # the first pass of the step-4b burn-down for exactly that reason.
  lint-gates:
    name: lints held at zero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The module graph is acyclic. This is the only thing that keeps it so: a
      # cycle costs nothing at runtime, so one `use crate::` in the wrong
      # direction is invisible until someone tries to split the crate. The check
      # reads source only and needs no build.
      - name: kolibrie's module graph is acyclic
        run: python3 scripts/module_graph.py --check
      # The README is the first thing a reader tries and nothing checked it: sixteen
      # of its twenty-three examples did not compile when this check was written.
      - name: the README's examples compile
        run: python3 scripts/readme_examples.py
      # docs/api.md is generated, and generating it is only worth anything if a
      # stale copy fails. The 371 hand-written lines it replaced documented three
      # methods that no longer existed.
      - name: docs/api.md matches the source
        run: python3 scripts/api_surface.py --check
      # unreachable_pub reached zero workspace-wide in step 4b.
      - name: unreachable_pub, default features
        run: scripts/check_lint.sh unreachable_pub -- --workspace --all-targets
      - name: unreachable_pub, ml feature
        run: scripts/check_lint.sh unreachable_pub -- -p kolibrie --features ml --all-targets
      - name: unreachable_pub, no default features
        run: scripts/check_lint.sh unreachable_pub -- -p kolibrie --no-default-features --all-targets
      # missing_docs is now held at zero across every crate's `src`, so one check
      # replaces the six per-crate lines this job used to carry. `--crate-src`
      # covers `<crate>/src/**` everywhere at once, which means a crate added
      # tomorrow is gated the day it lands; a per-crate list silently would not
      # cover it. The failure output names every offending path, so it still says
      # which crate regressed.
      #
      # Scoped to `src` rather than whole crates on purpose. Tests, examples and
      # benches each want a crate-level doc comment of their own — ~110 items that
      # tell a reader nothing and are not part of any public surface — and twelve of
      # those come from criterion's own macros expanding in our benches, which
      # cannot be fixed here. A gate on the whole workspace is therefore not
      # reachable, and this is the part that is.
      - name: missing_docs under every crate's src
        run: scripts/check_lint.sh missing_docs --crate-src -- --workspace --all-targets
      # Two more configurations, for the same reason as unreachable_pub above: the
      # default build cannot see items behind `#[cfg(feature = "ml")]`, and 52 of
      # kolibrie's items live there. cli, kolibrie-http-server and python also have
      # an `ml` feature, but it gates no items they document, so the workspace run
      # above covers them.
      - name: missing_docs under src, ml feature
        run: scripts/check_lint.sh missing_docs --crate-src -- -p kolibrie --features ml --all-targets
      - name: missing_docs under src, no default features
        run: scripts/check_lint.sh missing_docs --crate-src -- -p kolibrie --no-default-features --all-targets
      # missing_debug_implementations reached zero under every crate's src in the
      # same way. Satisfied with summarising hand-written impls wherever the type
      # holds a dataset, so `{:?}` on a store or an engine prints counts rather than
      # its contents, and none of those impls takes a lock or can panic.
      - name: missing_debug_implementations under every crate's src
        run: scripts/check_lint.sh missing_debug_implementations --crate-src -- --workspace --all-targets
      - name: missing_debug_implementations under src, ml feature
        run: scripts/check_lint.sh missing_debug_implementations --crate-src -- -p kolibrie --features ml --all-targets
      - name: missing_debug_implementations under src, no default features
        run: scripts/check_lint.sh missing_debug_implementations --crate-src -- -p kolibrie --no-default-features --all-targets
      # unused_qualifications reached zero across the whole workspace, not only under
      # src: unlike missing_docs it had nothing to say about tests, examples or
      # benches that was not worth fixing, so this needs no `--crate-src`. Three of
      # the 29 sites were visible only with the ml feature, two of them in an
      # example, which is why the feature configurations are checked here too.
      - name: unused_qualifications, default features
        run: scripts/check_lint.sh unused_qualifications -- --workspace --all-targets
      - name: unused_qualifications, ml feature
        run: scripts/check_lint.sh unused_qualifications -- -p kolibrie --features ml --all-targets
      - name: unused_qualifications, no default features
        run: scripts/check_lint.sh unused_qualifications -- -p kolibrie --no-default-features --all-targets
      # deprecated reached zero when one example was moved off the pre-0.9 `rand`
      # names. Gated, but note this one differs from the others above: it can fire
      # from a dependency update rather than from a change here, because what counts
      # as deprecated is upstream's decision. A red build after a `cargo update` is
      # that, not a regression — fix the call sites or pin, do not reach for an
      # `#[allow]`.
      - name: deprecated, default features
        run: scripts/check_lint.sh deprecated -- --workspace --all-targets
      - name: deprecated, ml feature
        run: scripts/check_lint.sh deprecated -- -p kolibrie --features ml --all-targets
      - name: deprecated, no default features
        run: scripts/check_lint.sh deprecated -- -p kolibrie --no-default-features --all-targets
      # unsafe_code is zero in a different sense from the lints above: the remaining
      # unsafe is necessary and carries a scoped `#[allow(unsafe_code)]` with a SAFETY
      # comment, rather than having been removed. Four sites — a GlobalAlloc impl in
      # the allocation_profile test, which is an unsafe trait, and three
      # platform-specific resident-set-size readers in one example, which std has no
      # equivalent for. The gate therefore catches *new* unsafe, and the allow is what
      # makes adding it a deliberate, reviewed act.
      #
      # Note the allows cover blocks this runner never compiles: the Windows and Linux
      # readers are behind `#[cfg]`, so a macOS check sees neither.
      - name: unsafe_code, default features
        run: scripts/check_lint.sh unsafe_code -- --workspace --all-targets
      - name: unsafe_code, ml feature
        run: scripts/check_lint.sh unsafe_code -- -p kolibrie --features ml --all-targets
      - name: unsafe_code, no default features
        run: scripts/check_lint.sh unsafe_code -- -p kolibrie --no-default-features --all-targets

  # ── Advisory for now: reports, does not block ───────────────────────────────
  #
  # `clippy` still reports freely here. `missing_docs` reports the 107 that remain
  # outside every crate's `src`: 95 are one crate-level comment per test, example and
  # bench, and 12 come from criterion's own macros and cannot be fixed here. That is
  # all that is left of the 3,022-warning baseline from step 1 — six lints are held at
  # zero by the blocking job above, so anything this job reports beyond those 107 is
  # new.

  lint-report:
    name: clippy + warning count (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Warning count by lint
        run: python3 scripts/warning_report.py --by-crate

  supply-chain:
    name: deny + unused deps (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: "cargo-deny,cargo-machete"
      - run: cargo deny check licenses bans sources
      - run: cargo machete
