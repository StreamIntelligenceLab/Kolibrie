name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Gates that must stay green ──────────────────────────────────────────────

  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [default, no-default]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          if [ "${{ matrix.features }}" = "no-default" ]; then
            cargo build --workspace --all-targets --no-default-features
          else
            cargo build --workspace --all-targets
          fi
      - name: Test
        run: |
          if [ "${{ matrix.features }}" = "no-default" ]; then
            cargo test --workspace --all-targets --no-default-features
          else
            cargo test --workspace --all-targets
          fi

  # Advisory until the one-off `cargo fmt --all` commit lands: the tree has never
  # been formatted, so this currently reports ~1,590 hunks. That reformat needs a
  # quiet merge window — it conflicts with every in-flight branch. Flip
  # `continue-on-error` to false in the same commit.
  fmt:
    name: rustfmt (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin to the declared rust-version so the MSRV is enforced, not aspirational.
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Broken intra-doc links are a hard failure even while `missing_docs` is
      # still only a warning.
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"

  # ── The ML / Python surface, which `default-members` does not cover ─────────

  ml:
    name: ml feature + python cdylib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p kolibrie --features ml --all-targets
      - run: cargo build -p kolibrie-python

  # Blocking because these lints have reached zero in the scopes listed below and
  # must stay there. Both stay at `warn` in [workspace.lints] on purpose: making a
  # module private, or adding a public item mid-change, is exactly what trips them,
  # and a local `deny` would stop the build halfway through an edit. The gate belongs
  # at PR time instead.
  #
  # Checked under three feature configurations, not one. The default build cannot see
  # items behind `#[cfg(feature = "ml")]`: eight unreachable-pub items were missed on
  # the first pass of the step-4b burn-down for exactly that reason.
  lint-gates:
    name: lints held at zero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # unreachable_pub reached zero workspace-wide in step 4b.
      - name: unreachable_pub, default features
        run: scripts/check_lint.sh unreachable_pub -- --workspace --all-targets
      - name: unreachable_pub, ml feature
        run: scripts/check_lint.sh unreachable_pub -- -p kolibrie --features ml --all-targets
      - name: unreachable_pub, no default features
        run: scripts/check_lint.sh unreachable_pub -- -p kolibrie --no-default-features --all-targets
      # missing_docs is now held at zero across every crate's `src`, so one check
      # replaces the six per-crate lines this job used to carry. `--crate-src`
      # covers `<crate>/src/**` everywhere at once, which means a crate added
      # tomorrow is gated the day it lands; a per-crate list silently would not
      # cover it. The failure output names every offending path, so it still says
      # which crate regressed.
      #
      # Scoped to `src` rather than whole crates on purpose. Tests, examples and
      # benches each want a crate-level doc comment of their own — ~110 items that
      # tell a reader nothing and are not part of any public surface — and twelve of
      # those come from criterion's own macros expanding in our benches, which
      # cannot be fixed here. A gate on the whole workspace is therefore not
      # reachable, and this is the part that is.
      - name: missing_docs under every crate's src
        run: scripts/check_lint.sh missing_docs --crate-src -- --workspace --all-targets
      # Two more configurations, for the same reason as unreachable_pub above: the
      # default build cannot see items behind `#[cfg(feature = "ml")]`, and 52 of
      # kolibrie's items live there. cli, kolibrie-http-server and python also have
      # an `ml` feature, but it gates no items they document, so the workspace run
      # above covers them.
      - name: missing_docs under src, ml feature
        run: scripts/check_lint.sh missing_docs --crate-src -- -p kolibrie --features ml --all-targets
      - name: missing_docs under src, no default features
        run: scripts/check_lint.sh missing_docs --crate-src -- -p kolibrie --no-default-features --all-targets
      # missing_debug_implementations reached zero under every crate's src in the
      # same way. Satisfied with summarising hand-written impls wherever the type
      # holds a dataset, so `{:?}` on a store or an engine prints counts rather than
      # its contents, and none of those impls takes a lock or can panic.
      - name: missing_debug_implementations under every crate's src
        run: scripts/check_lint.sh missing_debug_implementations --crate-src -- --workspace --all-targets
      - name: missing_debug_implementations under src, ml feature
        run: scripts/check_lint.sh missing_debug_implementations --crate-src -- -p kolibrie --features ml --all-targets
      - name: missing_debug_implementations under src, no default features
        run: scripts/check_lint.sh missing_debug_implementations --crate-src -- -p kolibrie --no-default-features --all-targets

  # ── Advisory for now: reports, does not block ───────────────────────────────
  #
  # `clippy` still reports freely here, and `missing_docs` reports the ~115 that
  # remain outside every crate's `src` — one crate-level comment per test, example
  # and bench, plus twelve from criterion's macros. That is the tail of the
  # burn-down, not a regression; the library surface itself is gated above.

  lint-report:
    name: clippy + warning count (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Warning count by lint
        run: python3 scripts/warning_report.py --by-crate

  supply-chain:
    name: deny + unused deps (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: "cargo-deny,cargo-machete"
      - run: cargo deny check licenses bans sources
      - run: cargo machete

  public-api:
    name: public API surface (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # cargo-public-api needs a nightly rustdoc to emit its JSON.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-public-api }
      - name: Diff public API against the checked-in baselines
        run: |
          for c in shared datalog datalogmtl kolibrie ml; do
            echo "::group::$c"
            cargo public-api -p "$c" --simplified > "/tmp/$c.txt" || true
            if [ -f "api-baseline/$c.txt" ]; then
              diff -u "api-baseline/$c.txt" "/tmp/$c.txt" || true
            else
              echo "no baseline for $c yet"
            fi
            echo "::endgroup::"
          done
