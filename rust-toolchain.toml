# Toolchain for day-to-day development: whatever stable is installed locally,
# matching what CI builds with (dtolnay/rust-toolchain@stable).
# rust-toolchain.toml cannot express a version range, so the floor is
# `rust-version` in [workspace.package] (1.85), which cargo enforces and the
# `msrv` CI job tests.
[toolchain]
channel    = "stable"
components = ["rustfmt", "clippy"]
